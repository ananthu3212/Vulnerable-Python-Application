name: Security Scan — Intentionally Vulnerable Python App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  pages: write
  id-token: write

jobs:
  security-scan:
    uses: ananthu3212/shift-left-security-thesis/.github/workflows/security-scan-reusable.yml@main
    with:
      docker-image-name: vulnerable-python-app
      semgrep-config: p/python
      enable-flask-rules: true
      enable-dast: true
      app-start-command: python VulnerablePythonScript.py
      app-port: '5000'
      trivy-severity: HIGH,CRITICAL
      fail-on-findings: false
    secrets: inherit
